# UC1 Configuration - YAML Data File
#
# This file is the SINGLE SOURCE OF TRUTH for UC1 behavior.
# It is loaded at startup and validated by PolicyValidator.
#
# INVARIANTS (must be maintained):
# - Exactly 6 capability buckets (UC1-A to UC1-F)
# - Exactly 4 exit CTAs
# - Exactly 3 alternatives per bucket
# - Exactly 1 context question per bucket
#
# LOCK VERSION: Increment when making changes for audit trail.

intent_id: "explore_services_capabilities"
lock_version: "1.0.0"

# Fixed entry message - shown when user clicks "Explore services & capabilities"
# Per spec: DITSTEK-REVAMP-extracted.txt lines 58-60
entry_message: |
  Great — happy to guide you.
  Pick the closest area and I'll narrow it down from there.

# The 6 capability buckets (sub-use cases)
capability_buckets:
  - id: UC1-A
    trigger: "Product development & engineering"
    goal: "Orient product"
    context_question: "Are you building something new, or evolving an existing product?"
    alternatives:
      - "Clarify priorities first"
      - "Incremental improvements"
      - "Pause and reassess"

  - id: UC1-B
    trigger: "Application Modernization"
    goal: "Modernize system"
    context_question: "What's the primary goal — cloud migration, or rebuilding for scale?"
    alternatives:
      - "Start with assessment"
      - "Phase the migration"
      - "Parallel track approach"

  - id: UC1-C
    trigger: "Staff Augmentation & Talent"
    goal: "Build team"
    context_question: "Are you looking to augment your existing team, or build a new capability?"
    alternatives:
      - "Start with key roles"
      - "Full team setup"
      - "Flexible engagement"

  - id: UC1-D
    trigger: "AI/ML & Automation"
    goal: "Add intelligence"
    context_question: "Is this about adding AI to an existing product, or exploring new possibilities?"
    alternatives:
      - "Discovery workshop first"
      - "Proof of concept"
      - "Production-ready solution"

  - id: UC1-E
    trigger: "Cloud, DevOps & Scalability"
    goal: "Prepare for scale"
    context_question: "Are you preparing for growth, or solving current scaling challenges?"
    alternatives:
      - "Architecture review first"
      - "Quick wins approach"
      - "Full transformation"

  - id: UC1-F
    trigger: "Not sure yet / need guidance"
    goal: "Reduce confusion"
    context_question: "What's the biggest challenge you're facing right now?"
    alternatives:
      - "Clarify the problem first"
      - "Explore options together"
      - "Get expert guidance"

# The 4 exit CTAs (exactly 4, no more, no less)
exit_ctas:
  - choice: "Discuss my requirement now"
    outcome: "UC2"
  - choice: "Schedule a quick call"
    outcome: "calendar"
  - choice: "Continue exploring"
    outcome: "loop"
  - choice: "I'll explore on my own"
    outcome: "exit"

# Forbidden topics - LLM must NEVER mention these
forbidden_topics:
  - "pricing"
  - "price"
  - "cost"
  - "budget"
  - "$"
  - "dollar"
  - "rupee"
  - "technology stack"
  - "framework"
  - "React"
  - "Angular"
  - "Python"
  - "JavaScript"
  - "AWS"
  - "Azure"
  - "healthcare"
  - "finance"
  - "banking"
  - "retail"
  - "manufacturing"

# System prompt for name capture state
name_capture_prompt: "What should I call you?"

# Template for AI synthesis - {slots} are filled by orchestrator
synthesis_template: |
  Thanks, {user_name}. You're focused on {goal_description}, and {context_summary}.
  
  Here are a few ways we typically approach this:

# =========================================================================
# DYNAMIC EXPLORATION BUTTONS (NEW - 2026-01-15)
# =========================================================================
# Topic-specific buttons for FREE_EXPLORATION mode
# These are shown based on capability_bucket context
exploration_buttons:
  default:
    - "Get a demo"
    - "See case studies"
    - "Talk to an expert"
  
  # Bucket-specific overrides (use bucket ID as key)
  UC1-A:  # Product development
    - "See project examples"
    - "Get a consultation"
    - "Discuss my requirements"
  
  UC1-B:  # App modernization
    - "View migration stories"
    - "Get an assessment"
    - "Talk to architect"
  
  UC1-C:  # Staff augmentation
    - "See team profiles"
    - "Discuss hiring needs"
    - "Flexible engagement"
  
  UC1-D:  # AI/ML
    - "See AI demos"
    - "Discovery workshop"
    - "Proof of concept"
  
  UC1-E:  # Cloud/DevOps
    - "Architecture review"
    - "See scalability cases"
    - "Talk to DevOps team"
  
  UC1-F:  # Guidance
    - "Explore options together"
    - "Get expert guidance"
    - "Talk to consultant"

# =========================================================================
# EMAIL CAPTURE (NEW - 2026-01-15)
# =========================================================================
# Email is requested after 4-6 turns OR when user shows high intent
email_capture:
  min_turns_before_ask: 4
  max_turns_before_ask: 6
  prompt: "Before we continue, what's the best email to reach you at?"
  soft_prompt: "If you'd like, I can send you more details — what's your email?"
  skip_phrases:
    - "skip"
    - "no email"
    - "later"
    - "no thanks"
    - "not now"
