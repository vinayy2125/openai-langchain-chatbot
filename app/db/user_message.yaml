# D:\Chatbot\app\db\user_message.yaml
version: "0.1.0"

index:
  name: chunk_index
  prefix: "chunk:"
  storage_type: json

fields:
  - name: text
    type: text

  - name: session_id
    type: tag

  - name: timestamp
    type: text

  - name: embedding
    type: vector
    attrs:
      algorithm: flat
      distance_metric: cosine
      dtype: float32
      dims: 768