version: "0.1.0"

index:
  name: chat_history_index
  prefix: "chat_history:"
  storage_type: json

fields:
  - name: session_id
    type: tag

  - name: messages_text
    type: text

  - name: embedding
    type: vector
    attrs:
      algorithm: flat
      distance_metric: cosine
      dtype: float32
      dims: 768
