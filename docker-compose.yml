version: "3.9"

services:
  api:
    build: .
    container_name: chatbot_api
    volumes:
      - .:/app
    ports:
      - "8006:8006"
    env_file:
      - .env
    depends_on:
      - db


  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
    driver: local